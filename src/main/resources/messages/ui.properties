ui.projects.tokenCopy.GITHUB=A fine-grained token with read access to this repository's pull requests. ReleaseFlow checks it with GitHub, stores it encrypted, and never shows it again.
ui.projects.tokenCopy.GITLAB=A project access token with the <code>read_api</code> scope. ReleaseFlow checks it with this GitLab instance, stores it encrypted, and never shows it again.
ui.projects.tokenCopy.JIRA=An Atlassian API token for the account above, which can browse this project. ReleaseFlow checks it with Jira, stores it encrypted, and never shows it again.
ui.projects.tokenCopy.LINEAR=A Linear API key that can read this team. ReleaseFlow checks that it still reaches the same workspace, stores it encrypted, and never shows it again.
ui.projects.tokenMissing=Not configured. Every new change from this source needs review until a token lets ReleaseFlow check its files, and its history cannot be imported.
ui.projects.tokenSaved=Access token saved. New changes will be checked for sensitive files.
