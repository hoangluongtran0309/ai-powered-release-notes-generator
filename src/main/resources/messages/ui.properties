ui.projects.webhookPath=Webhook path
ui.projects.webhookSetupCopy=In each source's webhook settings, use your ReleaseFlow address followed by that source's path as the payload URL: on GitHub, content type <code>application/json</code>, the saved secret, and the <strong>Pull requests</strong> event; on GitLab, the saved secret and the <strong>Merge request events</strong> trigger; on Linear, the <strong>Issues</strong> event, with Linear's own signing secret pasted into ReleaseFlow when the team was connected. Each merged pull request, merge request, and completed issue is recorded once. Jira needs no webhook: ReleaseFlow reads each Jira project every few minutes for issues completed since it was connected. Import earlier changes from the Change Inbox, where a source keeps a history to import.
