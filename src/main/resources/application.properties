spring.application.name=ReleaseFlow
spring.datasource.url=${RELEASEFLOW_DB_URL}
spring.datasource.username=${RELEASEFLOW_DB_USERNAME}
spring.datasource.password=${RELEASEFLOW_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
releaseflow.credentials.master-key=${RELEASEFLOW_CREDENTIAL_MASTER_KEY}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${RELEASEFLOW_SESSION_COOKIE_SECURE:false}
releaseflow.openai.api-key=${RELEASEFLOW_OPENAI_API_KEY:}
releaseflow.openai.model=${RELEASEFLOW_OPENAI_MODEL:}
releaseflow.openai.base-url=${RELEASEFLOW_OPENAI_BASE_URL:https://api.openai.com/v1}
releaseflow.openai.timeout=${RELEASEFLOW_OPENAI_TIMEOUT:PT30S}
