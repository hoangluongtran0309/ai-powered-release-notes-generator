spring.application.name=ReleaseFlow
spring.datasource.url=${RELEASEFLOW_DB_URL}
spring.datasource.username=${RELEASEFLOW_DB_USERNAME}
spring.datasource.password=${RELEASEFLOW_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
spring.messages.basename=messages/ui
spring.messages.encoding=UTF-8
# A missing translation must be visible in tests rather than silently served in the
# deployment's own locale, so no bundle ever falls back to the system locale.
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=true
# The management server is loopback-only by default. The demo Compose stack overrides the
# address inside its private observability network and never publishes the port.
management.server.port=${RELEASEFLOW_MANAGEMENT_PORT:8081}
management.server.address=${RELEASEFLOW_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# SMTP delivery is optional, so process health must not depend on an unconfigured mail
# server; a deployment that requires mail can opt in.
management.health.mail.enabled=${RELEASEFLOW_MANAGEMENT_HEALTH_MAIL:false}
releaseflow.credentials.master-key=${RELEASEFLOW_CREDENTIAL_MASTER_KEY}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${RELEASEFLOW_SESSION_COOKIE_SECURE:false}
releaseflow.ai.provider=${RELEASEFLOW_AI_PROVIDER:}
releaseflow.ai.timeout=${RELEASEFLOW_AI_TIMEOUT:PT60S}
releaseflow.openai.api-key=${RELEASEFLOW_OPENAI_API_KEY:}
releaseflow.openai.model=${RELEASEFLOW_OPENAI_MODEL:}
releaseflow.openai.base-url=${RELEASEFLOW_OPENAI_BASE_URL:https://api.openai.com/v1}
releaseflow.anthropic.api-key=${RELEASEFLOW_ANTHROPIC_API_KEY:}
releaseflow.anthropic.model=${RELEASEFLOW_ANTHROPIC_MODEL:}
releaseflow.anthropic.base-url=${RELEASEFLOW_ANTHROPIC_BASE_URL:https://api.anthropic.com}
releaseflow.deepseek.api-key=${RELEASEFLOW_DEEPSEEK_API_KEY:}
releaseflow.deepseek.model=${RELEASEFLOW_DEEPSEEK_MODEL:}
releaseflow.deepseek.base-url=${RELEASEFLOW_DEEPSEEK_BASE_URL:https://api.deepseek.com}
releaseflow.output-languages=${RELEASEFLOW_OUTPUT_LANGUAGES:en,vi}
# The UI languages this deployment ships translations for. The first one is what a
# request falls back to when neither the cookie, the account, nor Accept-Language picks.
releaseflow.ui-languages=${RELEASEFLOW_UI_LANGUAGES:en,vi}
releaseflow.translation.provider=${RELEASEFLOW_TRANSLATION_PROVIDER:disabled}
releaseflow.translation.timeout=${RELEASEFLOW_TRANSLATION_TIMEOUT:PT30S}
releaseflow.translation.worker-enabled=true
releaseflow.deepl.api-key=${RELEASEFLOW_DEEPL_API_KEY:}
releaseflow.deepl.base-url=${RELEASEFLOW_DEEPL_BASE_URL:}
releaseflow.invitations.ttl=${RELEASEFLOW_INVITATION_TTL:P7D}
releaseflow.github.api-base-url=${RELEASEFLOW_GITHUB_API_BASE_URL:https://api.github.com}
releaseflow.github.timeout=${RELEASEFLOW_GITHUB_TIMEOUT:PT10S}
releaseflow.gitlab.allowed-hosts=${RELEASEFLOW_GITLAB_ALLOWED_HOSTS:gitlab.com}
releaseflow.gitlab.timeout=${RELEASEFLOW_GITLAB_TIMEOUT:PT5S}
releaseflow.gitlab.webhook-clock-skew=${RELEASEFLOW_GITLAB_WEBHOOK_CLOCK_SKEW:PT5M}
releaseflow.linear.api-base-url=${RELEASEFLOW_LINEAR_API_BASE_URL:https://api.linear.app}
releaseflow.linear.timeout=${RELEASEFLOW_LINEAR_TIMEOUT:PT5S}
releaseflow.linear.webhook-clock-skew=${RELEASEFLOW_LINEAR_WEBHOOK_CLOCK_SKEW:PT60S}
releaseflow.jira.timeout=${RELEASEFLOW_JIRA_TIMEOUT:PT10S}
releaseflow.jira.description-max-characters=${RELEASEFLOW_JIRA_DESCRIPTION_MAX_CHARACTERS:8000}
releaseflow.jira.poll-interval=${RELEASEFLOW_JIRA_POLL_INTERVAL:PT5M}
releaseflow.jira.poll-overlap=${RELEASEFLOW_JIRA_POLL_OVERLAP:PT10M}
# Empty means each source's own site. Set it only to stand in for Jira Cloud locally.
releaseflow.jira.api-base-url=${RELEASEFLOW_JIRA_API_BASE_URL:}
releaseflow.webhooks.max-body-bytes=${RELEASEFLOW_WEBHOOK_MAX_BODY_BYTES:1048576}
# Where this deployment is reached from outside. Every public link ReleaseFlow writes is
# built from this, never from a request's Host header.
releaseflow.public.base-url=${RELEASEFLOW_PUBLIC_BASE_URL:http://localhost:8080}
# Set this to serve each Organization's changelog at {slug}.{domain}; wildcard DNS and
# TLS are the deployment's own. Empty means changelogs answer by path only.
releaseflow.public.changelog-base-domain=${RELEASEFLOW_PUBLIC_CHANGELOG_BASE_DOMAIN:}
releaseflow.automation.worker-enabled=true
releaseflow.automation.timeout=${RELEASEFLOW_AUTOMATION_TIMEOUT:PT10S}
releaseflow.automation.email.from=${RELEASEFLOW_AUTOMATION_EMAIL_FROM:}
releaseflow.automation.slack.allowed-hosts=${RELEASEFLOW_SLACK_ALLOWED_HOSTS:hooks.slack.com,hooks.slack-gov.com}
releaseflow.automation.notion.api-base-url=${RELEASEFLOW_NOTION_API_BASE_URL:https://api.notion.com}
# The Notion API is versioned by date, and a page is written the way the pinned version
# accepts. Change it only together with the body NotionActionExecutor sends.
releaseflow.automation.notion.version=${RELEASEFLOW_NOTION_VERSION:2026-03-11}
# Empty means each action's own Confluence site. Set it only to stand in for Confluence
# Cloud locally; the site is still checked, and the links recorded still point at it.
releaseflow.automation.confluence.api-base-url=${RELEASEFLOW_CONFLUENCE_API_BASE_URL:}
# Empty means each action's own Workflows callback. Set it only to stand in for the Power
# Platform locally; the callback URL is still checked and its path and signature are kept.
releaseflow.automation.teams.api-base-url=${RELEASEFLOW_TEAMS_API_BASE_URL:}
# Empty means each action's own {subdomain}.zendesk.com. Set it only to stand in for
# Zendesk locally; the subdomain is still checked.
releaseflow.automation.zendesk.api-base-url=${RELEASEFLOW_ZENDESK_API_BASE_URL:}
releaseflow.automation.trigger-worker-enabled=true
releaseflow.automation.trigger-delay=${RELEASEFLOW_AUTOMATION_TRIGGER_DELAY:PT15S}
releaseflow.automation.trigger-batch-size=${RELEASEFLOW_AUTOMATION_TRIGGER_BATCH_SIZE:20}
# With no notice at all a reminder goes out as the release comes due, so the scan looks
# this far ahead rather than at one exact instant.
releaseflow.automation.reminder-zero-day-lookahead=${RELEASEFLOW_AUTOMATION_REMINDER_LOOKAHEAD:PT15S}
releaseflow.automation.webhook-clock-skew=${RELEASEFLOW_AUTOMATION_WEBHOOK_CLOCK_SKEW:PT5M}
# An automation webhook body carries one release ID, so it is held far below the limit
# a provider's own deliveries need.
releaseflow.automation.webhook-max-body-bytes=${RELEASEFLOW_AUTOMATION_WEBHOOK_MAX_BODY_BYTES:65536}
spring.mail.host=${RELEASEFLOW_SMTP_HOST:}
spring.mail.port=${RELEASEFLOW_SMTP_PORT:25}
spring.mail.username=${RELEASEFLOW_SMTP_USERNAME:}
spring.mail.password=${RELEASEFLOW_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${RELEASEFLOW_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${RELEASEFLOW_SMTP_STARTTLS:false}
releaseflow.processing.enabled=true
releaseflow.import.item-limit=500
releaseflow.classification.sensitive-paths=${RELEASEFLOW_SENSITIVE_PATHS:**/security/**,**/auth/**,**/*Security*,**/*Auth*,**/*Credential*,**/*Password*,**/db/migration/**,**/*.sql,**/pom.xml,**/package.json,**/package-lock.json,.github/workflows/**,**/Dockerfile,**/application*.properties,**/*.env*}
releaseflow.classification.context-threshold=${RELEASEFLOW_CONTEXT_THRESHOLD:60}
releaseflow.classification.duplicate-threshold=${RELEASEFLOW_DUPLICATE_THRESHOLD:0.82}
