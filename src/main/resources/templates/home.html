<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReleaseFlow</title>
    <link rel="stylesheet" th:href="@{/css/releaseflow.css}">
</head>
<body>
<main>
    <p class="eyebrow">ReleaseFlow</p>
    <h1>Human-reviewed release notes</h1>
    <p>ReleaseFlow is being rebuilt one complete capability at a time.</p>
    <div class="actions" th:if="${currentUser == null}">
        <a class="button" th:href="@{/register}">Create an organization</a>
        <a th:href="@{/login}">Sign in</a>
    </div>
    <div th:if="${currentUser != null}">
        <p class="success" th:text="|Signed in as ${currentUser}.|">Signed in.</p>
        <form th:action="@{/logout}" method="post">
            <button class="link-button" type="submit">Sign out</button>
        </form>
    </div>
    <a class="status-link" href="/api/status">View application status</a>
</main>
</body>
</html>
