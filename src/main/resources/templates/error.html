<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/auth}">
<head>
    <title th:text="#{ui.error.title}">Something went wrong</title>
</head>
<body>
<main layout:fragment="content" class="flex min-h-screen items-center justify-center p-5 sm:p-10">
    <div class="w-full max-w-lg">
        <a th:href="@{/}" class="mb-8 flex items-center gap-3 text-xl font-bold">
            <img th:src="@{/svg/releaseflow-mark.svg}" src="/svg/releaseflow-mark.svg" alt="" aria-hidden="true"
                 width="40" height="40" class="h-10 w-10 shrink-0"> ReleaseFlow
        </a>
        <div class="auth-card">
            <p class="text-sm font-semibold text-slate-500" th:text="${status}">404</p>
            <h1 class="mt-2 text-3xl font-bold tracking-tight"
                th:text="#{'ui.error.' + ${statusKey} + '.heading'}">That page does not exist</h1>
            <p class="mt-3 text-sm text-slate-600"
               th:text="#{'ui.error.' + ${statusKey} + '.body'}">The address may be mistyped.</p>
            <p class="mt-4 break-all font-mono text-xs text-slate-500" th:if="${path != null}">
                <span th:text="#{ui.error.address}">Address</span>
                <span th:text="${path}">/nope</span>
            </p>
            <a class="btn btn-primary mt-7 min-h-12" th:href="@{/}"
               th:text="#{ui.error.backToWorkspace}">Back to the workspace</a>
        </div>
    </div>
</main>
</body>
</html>
