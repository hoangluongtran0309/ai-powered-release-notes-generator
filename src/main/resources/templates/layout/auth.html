<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE">ReleaseFlow</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/svg/releaseflow-mark.svg}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <script>
        (() => {
            let saved = null;
            try { saved = localStorage.getItem('releaseflow:theme'); } catch (ignored) { }
            document.documentElement.dataset.theme = saved === 'dark' || saved === 'light'
                ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body class="theme-canvas min-h-screen">
<button type="button" class="theme-floating-control btn btn-ghost btn-square fixed right-2 top-2 z-50 h-11 min-h-11 w-11 min-w-11 border shadow-sm backdrop-blur sm:right-4 sm:top-4"
        x-data="themeToggle()" @click="toggle" :aria-label="label" :title="label" aria-label="Toggle theme">
    <svg x-show="theme === 'light'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z"/>
    </svg>
    <svg x-show="theme === 'dark'" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <circle cx="12" cy="12" r="4" stroke-width="1.8"/><path stroke-linecap="round" stroke-width="1.8" d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
    </svg>
</button>
<main layout:fragment="content"></main>
<script th:src="@{/js/app.js}" defer></script>
<script th:src="@{/webjars/alpinejs/dist/cdn.min.js}" defer></script>
</body>
</html>
