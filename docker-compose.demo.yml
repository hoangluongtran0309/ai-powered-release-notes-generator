# ReleaseFlow demo stack: the application image and PostgreSQL. GitHub and
# OpenAI remain external services configured through the environment.
#
#   cp .env.example .env    # then replace every REPLACE_ME value
#   docker compose -f docker-compose.demo.yml up --build
#
# Open http://127.0.0.1:${RELEASEFLOW_HTTP_PORT:-8080}. `down --volumes` wipes
# the demo data. This stack is for local evaluation, not production.

name: releaseflow

services:
  app:
    image: releaseflow:demo
    build:
      context: .
    environment:
      RELEASEFLOW_DB_URL: jdbc:postgresql://db:5432/${RELEASEFLOW_DB_NAME:-releaseflow}
      RELEASEFLOW_DB_USERNAME: ${RELEASEFLOW_DB_USERNAME:-releaseflow}
      RELEASEFLOW_DB_PASSWORD: ${RELEASEFLOW_DB_PASSWORD:?set RELEASEFLOW_DB_PASSWORD in .env}
      RELEASEFLOW_CREDENTIAL_MASTER_KEY: ${RELEASEFLOW_CREDENTIAL_MASTER_KEY:?set RELEASEFLOW_CREDENTIAL_MASTER_KEY in .env (openssl rand -base64 32)}
      RELEASEFLOW_SESSION_COOKIE_SECURE: ${RELEASEFLOW_SESSION_COOKIE_SECURE:-false}
      # Optional AI classification; leave the provider empty to use the rules only.
      RELEASEFLOW_AI_PROVIDER: ${RELEASEFLOW_AI_PROVIDER:-}
      RELEASEFLOW_OPENAI_API_KEY: ${RELEASEFLOW_OPENAI_API_KEY:-}
      RELEASEFLOW_OPENAI_MODEL: ${RELEASEFLOW_OPENAI_MODEL:-}
      RELEASEFLOW_ANTHROPIC_API_KEY: ${RELEASEFLOW_ANTHROPIC_API_KEY:-}
      RELEASEFLOW_ANTHROPIC_MODEL: ${RELEASEFLOW_ANTHROPIC_MODEL:-}
      RELEASEFLOW_DEEPSEEK_API_KEY: ${RELEASEFLOW_DEEPSEEK_API_KEY:-}
      RELEASEFLOW_DEEPSEEK_MODEL: ${RELEASEFLOW_DEEPSEEK_MODEL:-}
      # Optional translation of release notes; disabled unless set to deepl.
      RELEASEFLOW_TRANSLATION_PROVIDER: ${RELEASEFLOW_TRANSLATION_PROVIDER:-disabled}
      RELEASEFLOW_DEEPL_API_KEY: ${RELEASEFLOW_DEEPL_API_KEY:-}
      RELEASEFLOW_DEEPL_BASE_URL: ${RELEASEFLOW_DEEPL_BASE_URL:-}
      # Optional email automation; an email action cannot be enabled without both.
      RELEASEFLOW_SMTP_HOST: ${RELEASEFLOW_SMTP_HOST:-}
      RELEASEFLOW_SMTP_PORT: ${RELEASEFLOW_SMTP_PORT:-587}
      RELEASEFLOW_SMTP_USERNAME: ${RELEASEFLOW_SMTP_USERNAME:-}
      RELEASEFLOW_SMTP_PASSWORD: ${RELEASEFLOW_SMTP_PASSWORD:-}
      RELEASEFLOW_SMTP_AUTH: ${RELEASEFLOW_SMTP_AUTH:-false}
      RELEASEFLOW_SMTP_STARTTLS: ${RELEASEFLOW_SMTP_STARTTLS:-false}
      RELEASEFLOW_AUTOMATION_EMAIL_FROM: ${RELEASEFLOW_AUTOMATION_EMAIL_FROM:-}
      # Public changelog links are built from this, never from a request's Host header.
      RELEASEFLOW_PUBLIC_BASE_URL: ${RELEASEFLOW_PUBLIC_BASE_URL:-http://localhost:8080}
      # Empty serves changelogs by path only; a domain here needs wildcard DNS and TLS.
      RELEASEFLOW_PUBLIC_CHANGELOG_BASE_DOMAIN: ${RELEASEFLOW_PUBLIC_CHANGELOG_BASE_DOMAIN:-}
      # Notion and Confluence actions need no variables: their tokens are entered per
      # action in the UI, and RELEASEFLOW_NOTION_API_BASE_URL and
      # RELEASEFLOW_NOTION_VERSION have working defaults that must not be blanked.
      # Other optional settings, including RELEASEFLOW_SENSITIVE_PATHS, are
      # deliberately not forwarded: Compose turns an unset variable into an empty
      # string, which would replace the default in application.properties (an
      # empty sensitive-path list stops the application).
      # The GitHub access token is set per Project in the UI, not here.
    ports:
      - "127.0.0.1:${RELEASEFLOW_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - releaseflow

  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${RELEASEFLOW_DB_NAME:-releaseflow}
      POSTGRES_USER: ${RELEASEFLOW_DB_USERNAME:-releaseflow}
      POSTGRES_PASSWORD: ${RELEASEFLOW_DB_PASSWORD:?set RELEASEFLOW_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No published port: only the application reaches the database.
    networks:
      - releaseflow

volumes:
  postgres-data:
    name: releaseflow-demo-postgres-data

networks:
  releaseflow:
    name: releaseflow-demo
