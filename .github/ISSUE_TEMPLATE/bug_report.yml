name: Bug report
description: Something in ReleaseFlow does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A security weakness belongs in a
        private report instead: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Connect a GitHub source to a Project
        2. Merge a pull request titled "..."
        3. Open the Change Inbox
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you run, or the commit if you built it yourself.
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Quickstart bundle
        - Docker Compose demo stack
        - ./mvnw spring-boot:run
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove every token, secret, and password before pasting.
      render: text
