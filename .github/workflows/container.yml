name: Container

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: releaseflow:demo
  COMPOSE_FILE: docker-compose.demo.yml

jobs:
  image:
    name: Build, scan, and smoke test the container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate throwaway demo secrets
        shell: bash
        run: |
          env_file="${RUNNER_TEMP}/releaseflow.env"
          {
            echo "RELEASEFLOW_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "RELEASEFLOW_CREDENTIAL_MASTER_KEY=$(openssl rand -base64 32)"
            echo "RELEASEFLOW_GRAFANA_PASSWORD=$(openssl rand -hex 24)"
          } > "${env_file}"
          echo "COMPOSE_ENV_FILES=${env_file}" >> "${GITHUB_ENV}"
      - name: Validate Compose and observability configuration
        run: |
          docker compose -f "${COMPOSE_FILE}" config --quiet
          jq empty observability/grafana/dashboards/releaseflow-operations.json
          RELEASEFLOW_IMAGE="${IMAGE_NAME}" docker compose -f quickstart/compose.yaml config --quiet
      # The quickstart forwards the demo's variables less the management address, which
      # only Prometheus needs, so a variable added to one and not the other fails here.
      - name: Check the quickstart forwards the demo stack's variables
        shell: bash
        run: |
          app_variables() {
            docker compose -f "$1" config --format json | jq -r '.services.app.environment | keys[]'
          }
          # Read into variables rather than compared through process substitution, whose
          # failure would leave two empty lists that agree.
          demo="$(app_variables "${COMPOSE_FILE}" | grep -vx RELEASEFLOW_MANAGEMENT_ADDRESS)"
          quickstart="$(RELEASEFLOW_IMAGE="${IMAGE_NAME}" app_variables quickstart/compose.yaml)"
          if [[ -z "${quickstart}" ]]; then
            echo "No application variables were read from quickstart/compose.yaml." >&2
            exit 1
          fi
          diff <(printf '%s\n' "${demo}") <(printf '%s\n' "${quickstart}")
      - name: Build image
        run: docker build --tag "${IMAGE_NAME}" .
      - name: Install Trivy with checksum verification
        run: ./scripts/ci/install-trivy.sh "${RUNNER_TEMP}/bin"
      - name: Scan image for high and critical vulnerabilities
        run: |
          "${RUNNER_TEMP}/bin/trivy" image \
            --exit-code 1 \
            --no-progress \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --skip-version-check \
            "${IMAGE_NAME}"
      - name: Start demo stack and wait for health checks
        run: docker compose -f "${COMPOSE_FILE}" up --detach --no-build --wait --wait-timeout 180
      - name: Smoke test the running application
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/status \
            | jq -e '.status == "UP"'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/login
          if [[ -n "$(docker port "$(docker compose -f "${COMPOSE_FILE}" ps --quiet db)")" ]]; then
            echo "The database port must not be published to the host." >&2
            exit 1
          fi
          user="$(docker compose -f "${COMPOSE_FILE}" exec -T app id -u)"
          if [[ "${user}" != "65534" ]]; then
            echo "The application must run as UID 65534, not ${user}." >&2
            exit 1
          fi
      - name: Verify the management port stays private
        shell: bash
        run: |
          # `docker compose port` prints "invalid IP:0" for a port nobody published, so
          # the published list is asked for directly, as the database check above does.
          if docker port "$(docker compose -f "${COMPOSE_FILE}" ps --quiet app)" | grep -q 8081; then
            echo "The management port must not be published to the host." >&2
            exit 1
          fi
          # Reachable from inside the container, and from Prometheus, and nowhere else.
          docker compose -f "${COMPOSE_FILE}" exec -T app \
            curl --fail --silent --show-error http://127.0.0.1:8081/actuator/health \
            | jq -e '.status == "UP" and (has("components") | not)'
          if curl --fail --silent --show-error --max-time 5 \
            --output /dev/null http://127.0.0.1:8081/actuator/prometheus; then
            echo "The management port answered on the host." >&2
            exit 1
          fi
      - name: Verify the scrape and the provisioned dashboard
        shell: bash
        run: |
          docker compose -f "${COMPOSE_FILE}" exec -T prometheus \
            promtool check config /etc/prometheus/prometheus.yml
          up="$(curl --fail --silent --show-error \
            'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22releaseflow%22%7D' \
            | jq -r '.data.result[0].value[1]')"
          if [[ "${up}" != "1" ]]; then
            echo "Prometheus is not scraping ReleaseFlow (up=${up})." >&2
            exit 1
          fi
          # Every family is present before anything has happened, because each series
          # is registered at zero when the application starts.
          for metric in \
            releaseflow_classification_completed_total \
            releaseflow_classification_collect_to_complete_seconds_count \
            releaseflow_classification_provider_requests_total \
            releaseflow_automation_action_executions_total; do
            if ! curl --fail --silent --show-error \
              "http://127.0.0.1:9090/api/v1/label/__name__/values" \
              | jq -e --arg metric "${metric}" '.data | index($metric)' > /dev/null; then
              echo "Prometheus never saw ${metric}." >&2
              exit 1
            fi
          done
          curl --fail --silent --show-error \
            --user "admin:$(grep RELEASEFLOW_GRAFANA_PASSWORD "${COMPOSE_ENV_FILES}" | cut -d= -f2-)" \
            'http://127.0.0.1:3000/api/search?query=ReleaseFlow%20Operations' \
            | jq -e 'map(.uid) | index("releaseflow-operations")'
      # The same script the Release workflow packages with, given the image built above.
      - name: Package the quickstart bundle with this image
        run: ./scripts/ci/package-quickstart.sh "${IMAGE_NAME}" "${RUNNER_TEMP}/quickstart"
      # Beside the demo stack, on port 18080 and its own project, volume, and network. This
      # job sets COMPOSE_FILE and COMPOSE_ENV_FILES for the demo, which the quickstart must
      # ignore, so this step proves that too.
      - name: Smoke test the quickstart bundle
        run: ./scripts/ci/test-quickstart.sh "${RUNNER_TEMP}/quickstart"
      - name: Capture Compose logs
        if: always()
        run: |
          mkdir -p target
          docker compose -f "${COMPOSE_FILE}" logs --no-color > target/compose.log 2>&1 || true
      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-logs-${{ github.run_id }}
          path: target/compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop demo stack
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" down --volumes --remove-orphans
