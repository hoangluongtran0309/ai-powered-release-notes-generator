name: Container

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: releaseflow:demo
  COMPOSE_FILE: docker-compose.demo.yml

jobs:
  image:
    name: Build, scan, and smoke test the container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate throwaway demo secrets
        shell: bash
        run: |
          env_file="${RUNNER_TEMP}/releaseflow.env"
          {
            echo "RELEASEFLOW_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "RELEASEFLOW_CREDENTIAL_MASTER_KEY=$(openssl rand -base64 32)"
          } > "${env_file}"
          echo "COMPOSE_ENV_FILES=${env_file}" >> "${GITHUB_ENV}"
      - name: Validate Compose configuration
        run: docker compose -f "${COMPOSE_FILE}" config --quiet
      - name: Build image
        run: docker build --tag "${IMAGE_NAME}" .
      - name: Install Trivy with checksum verification
        run: ./scripts/ci/install-trivy.sh "${RUNNER_TEMP}/bin"
      - name: Scan image for high and critical vulnerabilities
        run: |
          "${RUNNER_TEMP}/bin/trivy" image \
            --exit-code 1 \
            --no-progress \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --skip-version-check \
            "${IMAGE_NAME}"
      - name: Start demo stack and wait for health checks
        run: docker compose -f "${COMPOSE_FILE}" up --detach --no-build --wait --wait-timeout 180
      - name: Smoke test the running application
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/status \
            | jq -e '.status == "UP"'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/login
          if [[ -n "$(docker port "$(docker compose -f "${COMPOSE_FILE}" ps --quiet db)")" ]]; then
            echo "The database port must not be published to the host." >&2
            exit 1
          fi
          user="$(docker compose -f "${COMPOSE_FILE}" exec -T app id -u)"
          if [[ "${user}" != "65534" ]]; then
            echo "The application must run as UID 65534, not ${user}." >&2
            exit 1
          fi
      - name: Capture Compose logs
        if: always()
        run: |
          mkdir -p target
          docker compose -f "${COMPOSE_FILE}" logs --no-color > target/compose.log 2>&1 || true
      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-logs-${{ github.run_id }}
          path: target/compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop demo stack
        if: always()
        run: docker compose -f "${COMPOSE_FILE}" down --volumes --remove-orphans
