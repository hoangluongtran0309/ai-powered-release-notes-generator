name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  # Matches frontend-maven-plugin.nodeVersion in pom.xml.
  NODE_VERSION: "22.22.3"

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate Conventional Commit title
        shell: bash
        run: |
          pattern='^(feat|fix|docs|test|refactor|build|ci|chore)(\([a-z0-9]+(-[a-z0-9]+)*\))?: [a-z].*[^.]$'
          if [[ ! "${PR_TITLE}" =~ ${pattern} ]]; then
            echo "PR title must follow the commit convention in CONTRIBUTING.md." >&2
            exit 1
          fi

  workflow-lint:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint with checksum verification
        run: ./scripts/ci/install-actionlint.sh "${RUNNER_TEMP}/bin"
      - name: Validate workflows
        run: |
          "${RUNNER_TEMP}/bin/actionlint"

  frontend:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit all npm dependencies
        run: npm audit --audit-level=high

  backend:
    name: Maven verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify with PostgreSQL Testcontainers
        run: ./mvnw -B --no-transfer-progress clean verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-test-reports-${{ github.run_id }}
          path: target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7
