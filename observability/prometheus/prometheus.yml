# Scrapes the application's management port over the private observability network.
# That port is not published to the host, so this file is the only thing that reads it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: releaseflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app:8081]
